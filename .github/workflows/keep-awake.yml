name: Keep Backend Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Correct production backend URL
          BACKEND_URL="https://resumit.onrender.com/health"
          echo "Pinging $BACKEND_URL..."
          curl -f -s "$BACKEND_URL" || echo "Warning: Health check failed"
