name: Keep Backend Awake

on:
  schedule:
    # Run every 3 minutes
    - cron: '*/3 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="https://resumit.onrender.com/health"
          echo "Pinging $BACKEND_URL..."
          curl -f -s \
            --max-time 90 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            "$BACKEND_URL" \
            && echo "Backend is alive" \
            || echo "Warning: Health check failed after retries"
